name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy Webhook
        run: |
          curl -X POST https://deploy.scripthive.org/deploy \
            -H "X-Deploy-Secret: scripthive-deploy-secret-2024" \
            --fail \
            --silent \
            --show-error
          echo "Deploy triggered successfully!"
